# Render Blueprint: one free web service running the Node server (site + back office).
# Free plan note: the disk is reset when the service restarts or redeploys,
# so works added in the back office are lost then. See README for keeping them.
services:
  - type: web
    name: flowd-portfolio
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/settings
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HTTPS
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
